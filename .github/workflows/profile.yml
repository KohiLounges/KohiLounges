name: Profile

on:
  # cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # boton manual en la pestana Actions
  workflow_dispatch:

# Sin trigger de push: metrics commitea a main y se autodispararia en loop.

jobs:
  # ---------------------------------------------------------------
  # Snake de contribuciones -> branch 'output'
  # ---------------------------------------------------------------
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # PAT con scope 'repo' -> incluye las contribuciones privadas.
          # Sin esto solo dibuja las publicas.
          github_token: ${{ secrets.PROFILE_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=%23F5A623&color_dots=%23EBEDF0,%23F0D9A8,%23E8BC63,%23F5A623,%23B87409
            dist/snake-dark.svg?color_snake=%23F5A623&color_dots=%23161B22,%23553A12,%238A5E1C,%23C08327,%23F5A623

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # Card de stats -> metrics.svg en main
  # ---------------------------------------------------------------
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: KohiLounges
          filename: metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: America/Argentina/Buenos_Aires
          config_theme: dark

          # Contar repos privados y de las organizaciones
          repositories_affiliations: owner, collaborator, organization_member

          # Desglose de lenguajes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, liquid

          # Calendario isometrico del ano completo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Acento ambar para que matchee con el resto del README
          extras_css: |
            .field .label, h2 { color: #F5A623 !important; }
            svg { --color-calendar-graph-day-L4-bg: #F5A623; }
