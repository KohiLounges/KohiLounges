name: Generate Snake

on:
  schedule:
    # cada 12 horas
    - cron: "0 */12 * * *"
  # boton manual en la pestana Actions
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23F5A623&color_dots=%23EBEDF0,%23F0D9A8,%23E8BC63,%23F5A623,%23B87409
            dist/snake-dark.svg?color_snake=%23F5A623&color_dots=%23161B22,%23553A12,%238A5E1C,%23C08327,%23F5A623

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
